env: prod
http:
  host: 0.0.0.0
  port: 8000
  tls:
    enabled: true                     # 生产环境启用 HTTPS
    cert_file: "certs/fullchain.crt"     # TLS 证书文件路径
    key_file: "certs/tokenlive.net.key"      # TLS 私钥文件路径
security:
  api_sign:
    app_key: 123456
    app_security: 123456
  jwt:
    key: QQYnRFerJTSEcrfB89fw8prOaObmrch8
data:
  db:
    user:
      driver: ${DB_DRIVER:sqlite3}
      dsn: ${DB_DSN:storage/gateway.db?_busy_timeout=5000}
  redis:
    addr: ${REDIS_ADDR:}
    password: ${REDIS_PASSWORD:}
    db: ${REDIS_DB:0}
    read_timeout: 2s
    write_timeout: 2s
  clickhouse:
    addr: ["${CLICKHOUSE_ADDR:}"]
    database: "${CLICKHOUSE_DATABASE:tokenlive_gateway}"
    username: "${CLICKHOUSE_USERNAME:default}"
    password: "${CLICKHOUSE_PASSWORD:}"
log:
  log_level: info
  mode: both
  encoding: json
  log_file_name: "./storage/logs/server.log"

llm:
  enable_auth: true
  # API Key HMAC pepper. Must match tokenlive-admin GATEWAY_API_KEY_PEPPER.
  # Generate with: openssl rand -base64 32
  api_key_pepper: ${GATEWAY_API_KEY_PEPPER:}
  enable_metrics: true
  enable_logging: true
  enable_active_health_check: false

gateway:
  # Mode to fetch config: "local" (default.yml only), "redis" (synced via Redis), "http" (polled from Admin)
  config_source: ${GATEWAY_CONFIG_SOURCE:}
  # Mode to store runtime state (rate limits, circuit breakers): "memory" or "redis"
  state_store: ${GATEWAY_STATE_STORE:}
  # Required when config_source is "http"
  admin_url: ${ADMIN_SERVER_URL:}
  # 跳过 admin TLS 证书验证（本地回环 HTTPS + 域名证书场景，仅限开发环境）
  admin_tls_skip_verify: ${ADMIN_TLS_SKIP_VERIFY:false}
  sync_token: ${GATEWAY_SYNC_TOKEN:}

# 运行指标上报配置
otel:
  metrics:
    enabled: ${OTEL_ENABLED:false}
    endpoint: "${OTEL_ENDPOINT:}"
    insecure: true

# 策略触发事件发送配置
events:
  enabled: true
  type: redis
  topic: aigw:events:policy
  # 各个事件类型发送开关，不配置默认开启（true）
  types:
    circuit_break: true
    rate_limit: true
    invocation_fail: true
    lb_switch: true
  # kafka:
  #   brokers: ["localhost:9092"]

# LLM Gateway 配置（model-centric 格式）
models:
  gpt-4:
    request_types: [ chat_completion ]
    endpoints:
      - provider: openai-official
        url: http://free3.900406.xyz:8100/v1
        real_model: gpt-4
        priority: 1
        weight: 100
      - provider: openai-custom
        url: http://free3.900406.xyz:8100/v1
        real_model: gpt-4:free
        priority: 1
        weight: 100
  gpt-3.5-turbo:
    request_types: [ chat_completion ]
    endpoints:
      - provider: openai-official
        url: http://free3.900406.xyz:8100/v1
        real_model: gpt-3.5-turbo
        priority: 1
        weight: 100
  text-embedding-3-small:
    request_types: [ embedding ]
    endpoints:
      - provider: openai-official
        url: http://free3.900406.xyz:8100/v1
        real_model: text-embedding-3-small
        priority: 1
        weight: 100
  claude-sonnet:
    request_types: [ chat_completion ]
    endpoints:
      - provider: anthropic-official
        url: https://api.anthropic.com
        real_model: claude-3-opus-20240229
        priority: 1
        weight: 50
      - provider: anthropic-proxy
        url: http://free3.900406.xyz:8100
        real_model: claude-3-opus-20240229
        priority: 2
        weight: 50

providers:
  openai-official:
    protocol: openai
    api_key: ${OPENAI_API_KEY}
    timeout: 60s
    max_retries: 3
  openai-custom:
    protocol: openai
    api_key: ${OPENAI_API_KEY}
    timeout: 60s
    max_retries: 3
  anthropic-official:
    protocol: anthropic
    api_key: ${ANTHROPIC_API_KEY}
    timeout: 60s
  anthropic-proxy:
    protocol: anthropic
    api_key: sk-04a01ecdf6a3407f8b06e5b83dc1b5f4
    timeout: 60s

fallbacks:
  gpt-4:
    - gpt-4:free
    - gpt-3.5-turbo
  claude-sonnet:
    - gpt-4

# 治理策略配置
policy:
  # 策略合并优先级链条（自底向上合并覆盖：数组靠后的维度优先级更高，能覆盖前面的 non-nil 字段）
  priority_chain:
    - "global"         # 全局兜底
    - "tenant"         # 租户级通用限制
    - "user"           # 用户级通用限制
    - "model"          # 模型级通用限制
    - "tenant_model"   # 租户专属模型限制
    - "user_model"     # 用户专属模型限制

# 直观声明标准的 RequestType Pipelines 配置，包含重试、路由和负载均衡策略
pipelines:
  chat_completion:
    name: "chat_completion"
    request_types: [ "chat_completion" ]
    inbound_filters: [ "auth", "session_reader", "quota_check", "rate_limit", "tagging", "validate" ]
    outbound_filters: [ "token_settlement", "sticky_session", "metrics", "status_collector", "access_log", "event_publisher" ]
    critical_outbound_filters: [ "token_settlement", "sticky_session" ]
    invoker:
      type: "cluster"
      routers: [ "capability", "tenant_endpoint", "tag", "circuit_breaker", "priority" ]
      load_balancer: "round_robin"
      retry:
        retry: 0
        backoff_type: "exponential"
        base_ms: 100
        error_codes: [ "500", "502", "503", "504", "429" ]

  responses:
    name: "responses"
    request_types: [ "responses" ]
    inbound_filters: [ "auth", "session_reader", "quota_check", "rate_limit", "tagging", "validate" ]
    outbound_filters: [ "token_settlement", "sticky_session", "metrics", "status_collector", "access_log", "event_publisher" ]
    critical_outbound_filters: [ "token_settlement", "sticky_session" ]
    invoker:
      type: "cluster"
      routers: [ "capability", "tenant_endpoint", "tag", "circuit_breaker", "priority" ]
      load_balancer: "round_robin"
      retry:
        retry: 0
        backoff_type: "exponential"
        base_ms: 100
        error_codes: [ "500", "502", "503", "504", "429" ]

  embedding:
    name: "embedding"
    request_types: [ "embedding" ]
    inbound_filters: [ "auth", "session_reader", "quota_check", "rate_limit", "tagging", "validate" ]
    outbound_filters: [ "token_settlement", "sticky_session", "metrics", "status_collector", "access_log", "event_publisher" ]
    critical_outbound_filters: [ "token_settlement", "sticky_session" ]
    invoker:
      type: "cluster"
      routers: [ "capability", "tenant_endpoint", "tag", "circuit_breaker", "priority" ]
      load_balancer: "round_robin"
      retry:
        retry: 0
        backoff_type: "exponential"
        base_ms: 100
        error_codes: [ "500", "502", "503", "504", "429" ]

  # Messages 协议端点，支持原生与协议翻译路由，端点能否承接主要由 capability 路由决定
  messages:
    name: "messages"
    request_types: [ "messages" ]
    inbound_filters: [ "auth", "session_reader", "quota_check", "rate_limit", "tagging", "validate" ]
    outbound_filters: [ "token_settlement", "sticky_session", "metrics", "status_collector", "access_log", "event_publisher" ]
    critical_outbound_filters: [ "token_settlement", "sticky_session" ]
    invoker:
      type: "cluster"
      routers: [ "capability", "tenant_endpoint", "tag", "circuit_breaker", "priority" ]
      load_balancer: "round_robin"
      retry:
        retry: 0
        backoff_type: "exponential"
        base_ms: 100
        error_codes: [ "500", "502", "503", "504", "429" ]

# 静态兜底治理策略（当 Redis 中没有任何策略匹配时的冷启动防穿透/本地兜底规则）
policies:
  - invocation_policy:
      type: "failover"
      retry_policy:
        retry: 0
        backoff_type: "fixed"
        base_ms: 0
        connect_timeout: 15000
        ttft_timeout: 60000
        idle_timeout: 30000
        total_timeout: 600000
        error_codes:
          - "500"
          - "429"

access_log:
  clickhouse:
    enabled: false
  batch:
    batch_size: 2000
    flush_interval: 2s
